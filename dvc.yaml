stages:
  validate:
    cmd: uv run --locked python -m src.validate_data
    deps:
      - data/raw
      - src/validate_data.py
      - pyproject.toml
      - uv.lock
    outs:
      - reports/data_quality.json:
          cache: false

  prepare:
    cmd: uv run --locked python -m src.prepare
    deps:
      - reports/data_quality.json   # only runs after VALIDATE passed
      - data/raw                    # it reads the raw images itself
      - src/prepare.py
      - pyproject.toml
      - uv.lock
    params:
      - data.image_size
    outs:
      - data/processed/train
      - data/processed/validation
      - data/processed/test
      - data/processed/manifests
      - reports/data_summary.json:
          cache: false

  train:
    cmd: uv run --locked python -m src.train
    deps:
      - data/processed/train
      - data/processed/validation
      - data/processed/manifests
      - src/train.py
      - src/data.py
      - src/model.py
      - src/provenance.py
      - src/reproducibility.py
      - pyproject.toml
      - uv.lock
    params:
      - data.image_size
      - train.batch_size
      - train.epochs
      - train.learning_rate
      - train.dropout
      - train.random_state
      - augmentation.enabled
      - augmentation.horizontal_flip
      - augmentation.rotation_degrees
      - compute.device
      - tracking.uri
      - tracking.experiment
    outs:
      - models/model.pt
      - reports/training_curves.png:
          cache: false
      - reports/run_manifest.json:
          cache: false
    metrics:
      - reports/train_summary.json:
          cache: false

  evaluate:
    cmd: uv run --locked python -m src.evaluate
    deps:
      - data/processed/test
      - data/processed/manifests
      - src/evaluate.py
      - src/data.py
      - src/provenance.py
      - src/reproducibility.py
      - pyproject.toml
      - uv.lock
    params:
      - data.image_size
      - evaluation.batch_size
      - compute.device
      - tracking.uri
      - tracking.experiment
      - selection.run_id
    outs:
      - reports/test_confusion_matrix.png:
          cache: false
    metrics:
      - reports/test_metrics.json:
          cache: false
